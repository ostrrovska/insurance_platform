

services:
  # ─── Message Broker ──────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI  (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # ─── Databases ───────────────────────────────────────────────────
  customer_db:
    image: postgres:15-alpine
    container_name: customer_db
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - customer_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d customer_db"]
      interval: 5s
      retries: 5

  policy_db:
    image: postgres:15-alpine
    container_name: policy_db
    environment:
      POSTGRES_DB: policy_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - policy_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d policy_db"]
      interval: 5s
      retries: 5

  notification_db:
    image: postgres:15-alpine
    container_name: notification_db
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d notification_db"]
      interval: 5s
      retries: 5

  # ─── Microservices ───────────────────────────────────────────────
  customer_service:
    build: ./customer_service
    container_name: customer_service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://user:password@customer_db:5432/customer_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SERVICE_PORT: "8001"
    depends_on:
      customer_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  policy_service:
    build: ./policy_service
    container_name: policy_service
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://user:password@policy_db:5432/policy_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      CUSTOMER_SERVICE_URL: http://customer_service:8001
      SERVICE_PORT: "8002"
    depends_on:
      policy_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      customer_service:
        condition: service_started
    restart: on-failure

  notification_service:
    build: ./notification_service
    container_name: notification_service
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql://user:password@notification_db:5432/notification_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SERVICE_PORT: "8003"
    depends_on:
      notification_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

volumes:
  rabbitmq_data:
  customer_db_data:
  policy_db_data:
  notification_db_data:
